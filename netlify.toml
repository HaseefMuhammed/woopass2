# ============================================================
# WOO PASS — Netlify Deployment Configuration
# ============================================================

[build]
  publish = "."

# Security Headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com https://cdn.jsdelivr.net https://webspace-org-free-flies-host.netlify.app https://zoehealthplus4y93bkd82.netlify.app; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com; frame-src https://webspace-org-free-flies-host.netlify.app https://zoehealthplus4y93bkd82.netlify.app;"

# PWA Service Worker Header
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
    Content-Type = "application/javascript; charset=utf-8"

# PWA Manifest Header
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Clean alias for /app -> /app.html
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Allow direct access to app.html
[[redirects]]
  from = "/app.html"
  to = "/app.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
